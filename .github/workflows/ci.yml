name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, verified GitHub release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0, verified GitHub release commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Scan tracked files for high-confidence secrets
        shell: pwsh
        run: |
          $patterns = @(
            'AIza[0-9A-Za-z_-]{35}',
            'GOCSPX-[0-9A-Za-z_-]{20,}',
            '1//[0-9A-Za-z_-]{20,}',
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            '"refresh_token"\s*:\s*"[^"\r\n]+"'
          )
          $findings = [System.Collections.Generic.List[string]]::new()
          foreach ($path in (git ls-files)) {
            $item = Get-Item -LiteralPath $path -ErrorAction SilentlyContinue
            if (-not $item -or $item.Length -gt 5MB) { continue }
            $content = Get-Content -Raw -LiteralPath $path -ErrorAction SilentlyContinue
            if ($null -eq $content) { continue }
            foreach ($pattern in $patterns) {
              if ($content -match $pattern) {
                $findings.Add($path)
                break
              }
            }
          }
          if ($findings.Count -gt 0) {
            Write-Error "Potential secret found in tracked file(s): $($findings -join ', ')"
            exit 1
          }

      - name: Run offline tests
        run: python -m pytest -q

      - name: Smoke-test the CLI
        run: python -m insta360_converter --help
